[package]
name = "SkyLicense"
version = "0.1.0"
edition = "2024"

[features]
default = ["security-strict"]
security-compatible = []
security-balanced = []
security-strict = []
insecure-plaintext = []

# Release settings are maintained in the root workspace Cargo.toml.

[lib]
name = "SkyLicense_64"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21.1"

tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
webpki-roots = "1.0.12"
#bytebuf
bytes = "1.11.1"
byteorder = "1.4"
#encrypt
rand = "0.8.6"
aes-gcm = "0.11.1"
base64 = "0.22.1"
flate2 = "1.0"
sha2 = "0.10"
hmac = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1", features = ["derive"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
#hashmap
rustc-hash = "2.1"
#protection
libc = "0.2"
sysinfo = "0.28"
lazy_static = "1.4"
winapi = { version = "0.3.0", features = ["processthreadsapi", "memoryapi", "debugapi", "libloaderapi", "psapi", "winnt", "winbase", "handleapi", "wow64apiset", "tlhelp32", "ntdef", "errhandlingapi", "minwindef", "processenv", "fileapi", "namedpipeapi"] }
nix = { version = "0.26", features = ["ptrace", "process", "mman"] }
ctor = "0.2"
chrono = "0.4"
thiserror = "1.0"
ntapi = "0.4"
#obfuscation
obfuse = "1.0.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
