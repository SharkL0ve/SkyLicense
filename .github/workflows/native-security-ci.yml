name: native-security-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-23
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install pinned audit and SBOM tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: RustSec audit
        run: cargo audit
      - name: Generate CycloneDX SBOM
        run: cargo cyclonedx --format json
      - name: Upload native-client SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-client-cyclonedx-sbom
          path: native/SkyLicense.cdx.json
          if-no-files-found: error

  native-client:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rust_toolchain: 1.97.1-x86_64-pc-windows-msvc
            release_rustflags: -C control-flow-guard=checks -C link-arg=/guard:cf
          - os: ubuntu-latest
            rust_toolchain: 1.97.1-x86_64-unknown-linux-gnu
            release_rustflags: ""
    runs-on: ${{ matrix.os }}
    env:
      SKYLICENSE_MANIFEST_PUBLIC_KEY: "ea4a6c63e29c520abef5507b132ec5f9954776aebebe7b92421eea691446d22c"
      SKYLICENSE_MIN_SECURITY_EPOCH: "1"
      SKYLICENSE_SECURITY_EPOCH: "1"
      SKYLICENSE_BUILD_ID: "0909090909090909090909090909090909090909090909090909090909090909"
      SKYLICENSE_CERT_SHA256: "1111111111111111111111111111111111111111111111111111111111111111"
      SKYLICENSE_CERT_SHA256_NEXT: "2222222222222222222222222222222222222222222222222222222222222222"
      SKYLICENSE_ARTIFACT_CHANNEL: ci-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-23
        with:
          toolchain: ${{ matrix.rust_toolchain }}
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Formatting
        run: cargo fmt --all --check
      - name: Compile with warnings denied
        run: cargo check --all-targets --locked
        env:
          RUSTFLAGS: -D warnings
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Unit tests
        run: cargo test --locked -- --test-threads=1
      - name: Compatible profile remains buildable
        run: cargo check --all-targets --locked --no-default-features --features security-compatible
        env:
          RUSTFLAGS: -D warnings
      - name: Public WebPKI TLS 1.3 handshake remains usable without pinning
        shell: bash
        run: |
          env -u SKYLICENSE_CERT_SHA256 -u SKYLICENSE_CERT_SHA256_NEXT \
            CARGO_TARGET_DIR=target/webpki-compatible-unpinned \
            cargo test --locked --no-default-features --features security-compatible \
              tls::tests::public_webpki_tls13_handshake -- --ignored --exact
      - name: Balanced profile remains buildable
        run: cargo check --all-targets --locked --no-default-features --features security-balanced
        env:
          RUSTFLAGS: -D warnings
      - name: Explicit plaintext build remains warning-free
        run: cargo check --all-targets --locked --no-default-features --features security-compatible,insecure-plaintext
        env:
          RUSTFLAGS: -D warnings
      - name: Build strict release artifact and release tools
        run: cargo build --release --locked --lib --bin sign_artifact --bin verify_artifact
        env:
          RUSTFLAGS: ${{ matrix.release_rustflags }}
      - name: Verify Windows PE hardening
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./native/tools/verify-pe-hardening.ps1 -Path ./target/release/SkyLicense_64.dll
      - name: Verify Linux ELF hardening
        if: runner.os == 'Linux'
        shell: bash
        run: bash ./native/tools/verify-elf-hardening.sh target/release/libSkyLicense_64.so
      - name: Test-sign the release artifact
        shell: bash
        env:
          SKYLICENSE_MANIFEST_PRIVATE_KEY: "0707070707070707070707070707070707070707070707070707070707070707"
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            target/release/sign_artifact.exe target/release/SkyLicense_64.dll
          else
            target/release/sign_artifact target/release/libSkyLicense_64.so
          fi
      - name: Verify signed Windows artifact and manifest
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./native/tools/verify-pe-hardening.ps1 -Path ./target/release/SkyLicense_64.dll -RequireIntegrityManifest
      - name: Verify signed Linux artifact and manifest
        if: runner.os == 'Linux'
        shell: bash
        run: bash ./native/tools/verify-elf-hardening.sh target/release/libSkyLicense_64.so --require-integrity-manifest
      - name: Load signed native artifact in a real JVM
        shell: bash
        run: |
          mkdir -p target/native-load-smoke
          javac -d target/native-load-smoke native/tests/NativeLoadSmoke.java
          if [ "$RUNNER_OS" = "Windows" ]; then
            java -cp target/native-load-smoke NativeLoadSmoke "$PWD/target/release/SkyLicense_64.dll"
          else
            java -cp target/native-load-smoke NativeLoadSmoke "$PWD/target/release/libSkyLicense_64.so"
          fi
      - name: Reject a native artifact without its signed manifest
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/SkyLicense_64.dll target/native-load-smoke/unsigned.dll
            artifact="$PWD/target/native-load-smoke/unsigned.dll"
          else
            cp target/release/libSkyLicense_64.so target/native-load-smoke/unsigned.so
            artifact="$PWD/target/native-load-smoke/unsigned.so"
          fi
          if java -cp target/native-load-smoke NativeLoadSmoke "$artifact"; then
            echo "unsigned native artifact was unexpectedly accepted" >&2
            exit 1
          fi
